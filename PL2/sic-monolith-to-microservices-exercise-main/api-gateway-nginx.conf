events { }

http {
    server {
        listen 80;

        # Movies
        location /api/movies {
            proxy_pass http://localhost:3001/movies; # this api gateway will redirect requests with url /api/movies to this endpoint
        }

        # Users
        location /api/users {
            proxy_pass http://localhost:3003/users; # this api gateway will redirect requests with url /api/movies to this endpoint
        }
        
        # Reviews
        location /api/reviews {
            proxy_pass http://localhost:3002/reviews; # this api gateway will redirect requests with url /api/movies to this endpoint
        }
        # TODO: add the location for the other services
    }
}
