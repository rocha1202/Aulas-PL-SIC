server {
    listen 80;

    # Movies
    location /api/movies {
        proxy_pass http://movies-service:3001/movies;
    }

    # Users
    location /api/users {
        proxy_pass http://users-service:3003/users;
    }

    # Reviews
    location /api/reviews {
        proxy_pass http://reviews-service:3002/reviews;
    }
}
